name: macOS

# Builds and tests the SwiftUI app when its code changes.
on:
  push:
    branches: [main]
    paths: ['macos/**', 'assets/**', 'scripts/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['macos/**', 'assets/**', 'scripts/**', '.github/workflows/macos.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reuse compiled dependencies between runs; the key changes when Package.resolved does.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: macos/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('macos/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      # SwiftTerm compiles a Metal shader; Xcode 26+ ships the Metal Toolchain as a separate download.
      - run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - run: swift build
      # Unit tests plus the live FTP/FTPES/SFTP tests against throwaway local servers (sshd + pyftpdlib);
      # test-servers.sh exports the RSSH_* variables the integration tests are enabled by.
      - name: Unit + live FTP/FTPS/SFTP tests
        run: ../scripts/test-servers.sh swift test
