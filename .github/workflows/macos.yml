name: macOS

# Builds and tests the SwiftUI app when its code changes.
on:
  push:
    branches: [main]
    paths: ['macos/**', 'assets/**', 'scripts/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['macos/**', 'assets/**', 'scripts/**', '.github/workflows/macos.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v7
      - run: swift build
      - run: swift test
