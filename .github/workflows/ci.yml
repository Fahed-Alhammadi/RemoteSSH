name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        if: runner.os == 'Windows'
        run: npm test
      - name: Unit + live FTP/FTPS/SFTP tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-server
          npm run test:live

  macos:
    name: macOS app
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v7
      - run: swift build
      - run: swift test
