name: Windows

# Builds and tests the Electron app on Windows when its code changes.
on:
  push:
    branches: [main]
    paths: ['electron/**', 'windows/**', 'assets/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['electron/**', 'windows/**', 'assets/**', '.github/workflows/windows.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
