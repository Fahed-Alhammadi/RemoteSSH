name: Linux

# Builds and tests the Electron app on Linux (including the live FTP/FTPS/SFTP tests) when its code changes.
on:
  push:
    branches: [main]
    paths: ['electron/**', 'linux/**', 'assets/**', 'scripts/**', '.github/workflows/linux.yml']
  pull_request:
    paths: ['electron/**', 'linux/**', 'assets/**', 'scripts/**', '.github/workflows/linux.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Unit + live FTP/FTPS/SFTP tests
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-server
          npm run test:live
