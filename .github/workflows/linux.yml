name: Linux

# Builds and tests the Electron app on Linux (including the live FTP/FTPS/SFTP tests) when its code changes.
# Push a tag like linux-v1.2.0 to also build the packages and publish them as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['linux-v*']
    paths: ['electron/**', 'linux/**', 'assets/**', 'scripts/**', '.github/workflows/linux.yml']
  pull_request:
    paths: ['electron/**', 'linux/**', 'assets/**', 'scripts/**', '.github/workflows/linux.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci
      # The app version (and the update metadata) come from the tag, e.g. linux-v1.2.0 → 1.2.0.
      - if: startsWith(github.ref, 'refs/tags/')
        run: npm version "${GITHUB_REF_NAME#linux-v}" --no-git-tag-version --allow-same-version
      - run: npm run build
      - name: Unit + live FTP/FTPS/SFTP tests
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-server
          npm run test:live
      - if: startsWith(github.ref, 'refs/tags/')
        run: npm run dist:linux -- --publish never
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            linux/dist/*.AppImage
            linux/dist/*.deb
            linux/dist/*.tar.gz
            linux/dist/latest*.yml

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: artifacts
      # Releases are named "Linux 1.2.0"; the README's download badges show that name.
      - id: version
        run: echo "version=${GITHUB_REF_NAME#linux-v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          name: Linux ${{ steps.version.outputs.version }}
          draft: false
          generate_release_notes: true
          files: artifacts/*
