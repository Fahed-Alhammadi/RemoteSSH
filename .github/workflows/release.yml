name: Release

# Push a tag like v1.0.0 to build every platform and attach the packages to a draft release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # The app version (and the update metadata) come from the tag, e.g. v1.2.0 → 1.2.0.
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
        shell: bash
      - run: npm run dist:${{ matrix.target }} -- --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.tar.gz
            desktop/release/*.blockmap
            desktop/release/latest*.yml

  macos:
    name: Build macOS
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v7
      - run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh
      - run: ditto -c -k --keepParent dist/RemoteSSH.app "dist/RemoteSSH-${GITHUB_REF_NAME#v}-macos.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: macos/dist/*.zip

  release:
    needs: [desktop, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
