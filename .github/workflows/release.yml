name: Release

# Push a tag like v1.2.0 to build every platform and publish one GitHub release with all the packages.
# The app versions come from the tag. macOS is signed with a Developer ID and notarized.
# The macOS job runs in the `desktop-release` environment (only v* tags may use it; no approval step), which holds MACOS_CERTIFICATE_P12 / MACOS_CERTIFICATE_PASSWORD and UPDATE_SIGNING_KEY. After
# Windows and Linux are built it signs the Mac app and update-signatures.json(.sig) = the SHA-512 of every package,
# signed with Ed25519 (scripts/sign-update.mjs); the Windows/Linux app installs only updates listed in it
# (electron/src/main/updateSignature.ts).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  electron:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win
            dist: windows
          - os: ubuntu-latest
            target: linux
            dist: linux
    defaults:
      run:
        working-directory: electron
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci
      # The app version (and the update metadata) come from the tag, e.g. v1.2.0 → 1.2.0.
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm test
      - run: npm run dist:${{ matrix.target }} -- --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.dist }}
          path: |
            ${{ matrix.dist }}/dist/*.exe
            ${{ matrix.dist }}/dist/*.AppImage
            ${{ matrix.dist }}/dist/*.deb
            ${{ matrix.dist }}/dist/*.tar.gz
            ${{ matrix.dist }}/dist/*.blockmap
            ${{ matrix.dist }}/dist/latest*.yml

  macos:
    name: Build macOS and sign the release
    needs: electron
    runs-on: macos-15
    environment: desktop-release
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Releases are signed with the Developer ID certificate in the MACOS_CERTIFICATE_P12 secret (base64 .p12),
      # which goes into a throwaway keychain for this run only.
      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$MACOS_CERTIFICATE_P12" ] || { echo "::error::The MACOS_CERTIFICATE_P12 secret is not set"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Both Developer ID intermediates (the original and G2), so the certificate's chain to Apple's root is complete.
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL -o "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN" || true
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            security find-identity -p codesigning "$KEYCHAIN"
            echo "::error::No valid Developer ID Application identity in the certificate"
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      # SwiftTerm compiles a Metal shader; Xcode 26+ ships the Metal Toolchain as a separate download.
      - run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      # Unit tests (the live server tests skip themselves without RSSH_*) before anything is signed.
      - run: swift test
      - name: Build, sign and notarize
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="$VERSION" ./scripts/build-app.sh
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" ./scripts/notarize.sh
          rm "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent dist/RemoteSSH.app "dist/RemoteSSH-$VERSION-macos.zip"
      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: macos/dist/*.zip
      # update-signatures.json lists the SHA-512 of every package of the release (Windows, Linux and the Mac zip).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/signed
          merge-multiple: true
      - name: Sign the update list
        working-directory: .
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          SIGNED: ${{ runner.temp }}/signed
        run: |
          node scripts/sign-update.mjs "$SIGNED" app.remotessh.RemoteSSH "${GITHUB_REF_NAME#v}" electron/src/main/updateSignature.ts
          mkdir -p "$RUNNER_TEMP/sig" && mv "$SIGNED"/update-signatures.json* "$RUNNER_TEMP/sig"/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: ${{ runner.temp }}/sig/update-signatures.json*
          if-no-files-found: error

  release:
    needs: [electron, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ github.ref_name }}
          draft: false
          make_latest: true
          generate_release_notes: true
          files: artifacts/*
